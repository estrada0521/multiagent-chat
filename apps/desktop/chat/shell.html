<!doctype html>
<html lang="en" data-theme="__THEME__" data-desktop-chat="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="__DARK_BG__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__APP_DISPLAY_NAME__">
  <link rel="manifest" href="__CHAT_MANIFEST_URL__">
  <link rel="icon" type="image/png" sizes="192x192" href="__CHAT_PWA_ICON_192_URL__">
  <link rel="apple-touch-icon" href="__CHAT_APPLE_TOUCH_ICON_URL__">
  <title>__CHAT_DOCUMENT_TITLE__</title>
  <script>
    (() => {
      // iPadOS Safari's default UA impersonates macOS and sends no Client
      // Hints, so the server can't tell it apart from a real Mac -- only
      // touch capability can. Redirect before the mobile-vendor CDN script
      // below fetches anything the desktop variant doesn't need.
      try {
        if (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform || "")) {
          const url = new URL(window.location.href);
          if (url.searchParams.get("view") !== "mobile") {
            url.searchParams.set("view", "mobile");
            window.location.replace(url.toString());
          }
        }
      } catch (_) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search || "");
      const initialTheme = params.get("theme");
      if (initialTheme === "light" || initialTheme === "dark") {
        document.documentElement.dataset.theme = initialTheme;
      }
      const initialThemeDesktop = params.get("theme_desktop");
      if (["system", "light", "dark"].includes(initialThemeDesktop)) {
        document.documentElement.dataset.themeDesktop = initialThemeDesktop;
      }
      if (!initialTheme || initialThemeDesktop === "system") {
        document.documentElement.dataset.theme =
          window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (!initialThemeDesktop || initialThemeDesktop === "system") {
        try {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
            document.documentElement.dataset.theme = event.matches ? "dark" : "light";
          });
        } catch (_) {}
      }
      const inHubShell = params.get("hub_shell") === "1";
      if (inHubShell) {
        document.documentElement.dataset.hubShell = "1";
        document.documentElement.dataset.hubIframeChat = "1";
      }
      if (params.get("launch_shell") === "1") {
        document.documentElement.dataset.launchShell = "1";
      }
      try {
        const frameSidebarOpen =
          params.get("hub_sidebar") === "1" ||
          (window.frameElement && window.frameElement.dataset && window.frameElement.dataset.hubSidebarOpen === "1");
        if (frameSidebarOpen) {
          document.documentElement.dataset.hubSidebarOpen = "1";
        }
      } catch (_) {}
      // Detect Tauri desktop app via URL param, session marker, Tauri globals, or parent frame flag.
      function _detectTauri() {
        try {
          const stored = sessionStorage.getItem("agent_window_tauri_app") === "1";
          if (
            params.get("tauri") === "1" ||
            stored ||
            typeof window.__TAURI__ !== "undefined" ||
            typeof window.__TAURI_INTERNALS__ !== "undefined" ||
            (window.parent !== window && window.parent.__agentWindowNative?.appSettingsLoaded)
          ) {
            document.documentElement.dataset.tauriApp = "1";
            try { sessionStorage.setItem("agent_window_tauri_app", "1"); } catch (_) {}
            return true;
          }
        } catch (_) {}
        return false;
      }
      if (!_detectTauri()) {
        window.addEventListener("load", _detectTauri, { once: true });
      }
    })();
  </script>
__CHAT_MAIN_STYLE_BLOCK____CHAT_SHELL_STYLE_BLOCK__  <style id="chatFontSettingsStyle">
__CHAT_FONT_SETTINGS_INLINE_STYLE__
  </style>
</head>
<body>
  <section class="shell">
    __CHAT_HEADER_HTML__
    <main id="messages"></main>
    <button type="button" id="scrollToBottomBtn" title="Scroll to bottom" aria-label="Scroll to bottom"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
__CHAT_COMPOSER_HTML__  </section>
  <aside id="desktopRightPanel" class="desktop-right-panel" hidden>

    <div class="desktop-right-panel-card">

        <div id="dpRepoContent" class="dp-split-pane dp-split-pane-repo active"></div>
      </div>
    </div>

  <aside id="gitPinnedSummaryAside" class="git-pinned-summary-aside" hidden aria-label="Pinned Git Summary">
    <div id="gitPinnedSummaryInner" class="git-summary-wrap"></div>
  </aside>
