<!doctype html>
<html lang="en" data-theme="__THEME__" data-theme-desktop="__THEME_DESKTOP__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="__DARK_BG__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__APP_DISPLAY_NAME__">
  <link rel="manifest" href="__HUB_MANIFEST_URL__">
  <link rel="icon" type="image/png" sizes="192x192" href="__PWA_ICON_192_URL__">
  <link rel="apple-touch-icon" href="__APPLE_TOUCH_ICON_URL__">
  <script>
    (() => {
      // iPadOS Safari's default UA impersonates macOS and sends no Client
      // Hints, so the server can't tell it apart from a real Mac -- only
      // touch capability can.
      try {
        if (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform || "")) {
          const url = new URL(window.location.href);
          if (url.searchParams.get("view") !== "mobile") {
            url.searchParams.set("view", "mobile");
            window.location.replace(url.toString());
          }
        }
      } catch (_) {}
    })();
  </script>
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const isLocalHost = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === "[::1]";
      if (!(window.isSecureContext || isLocalHost)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/hub-service-worker.js", { scope: "/" }).catch((err) => {
          console.warn("hub service worker registration failed", err);
        });
      }, { once: true });
    })();
  </script>
  <title>__PAGE_TITLE__</title>
  <style>:root { --font-main: __MESSAGE_FONT_CSS__; --font-code: __CODE_FONT_CSS__; }</style>
  <script>
    (() => {
      const markTauriApp = () => {
        document.documentElement.dataset.tauriApp = "1";
        try { sessionStorage.setItem("agent_window_tauri_app", "1"); } catch (_) {}
        window.__agentWindowNative = window.__agentWindowNative || {};
        window.__agentWindowNative.isTauriApp = true;
      };
      try {
        const params = new URLSearchParams(window.location.search || "");
        const stored = sessionStorage.getItem("agent_window_tauri_app") === "1";
        if (
          params.get("tauri") === "1" ||
          stored ||
          typeof window.__TAURI__ !== "undefined" ||
          typeof window.__TAURI_INTERNALS__ !== "undefined"
        ) {
          markTauriApp();
        }
      } catch (_) {}
    })();
  </script>
  <style>
__HUB_INCLUDE:home.css__
  </style>
</head>
<body>

    <div class="fit-window-dots"><i></i><i></i><i></i></div>
    <div class="desk-top-right-controls" id="deskTopRightControls" aria-label="Window controls">

      </button>
      <div class="desk-right-panel-controls" id="deskRightPanelControls" aria-label="Right panel">
        <button type="button" class="desk-panel-ctrl-btn" id="deskPanelToggle" aria-label="Toggle Git / Repo panel" title="Git / Repo" aria-pressed="false">

        </button>
      </div>
    </div>
    <div class="desk-workbench" id="deskWorkbench">
      <aside class="desk-sidebar" id="deskSidebar">
        <div class="desk-sidebar-shell">
          <div class="desk-sidebar-content">
            <div class="desk-sidebar-sessions" id="deskSidebarSessions">
              <p class="desk-hub-tagline">Agent Window</p>
              <div class="desk-new-session-section">
                <div class="desk-session-row desk-new-session-toggle" id="deskNewSessionToggle" tabindex="0" role="button" aria-label="New Session">
                  <div class="desk-row-head">
                    <div class="desk-row-main">
                      <span class="desk-row-leading-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                          <path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"></path>
                        </svg>
                      </span>
                      <div class="desk-row-stack">
                        <div class="desk-row-name">New Session</div>
                      </div>
                      <span class="desk-row-kbd" aria-hidden="true">⌘N</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="desk-session-list" id="deskSessionList">
                <div class="desk-session-list-loading"><span class="desk-reload-shell-spinner" aria-hidden="true"></span></div>
              </div>
              <div class="desk-hub-message" id="deskHubMessage" role="status" aria-live="polite" aria-atomic="true" hidden></div>
              <p class="desk-hub-footer-credit">Made by H. Okada</p>
            </div>
          </div>
        </div>
      </aside>
      <div class="desk-floating-controls" aria-label="Hub controls">
        <button type="button" class="desk-app-sidebar-toggle" id="deskAppSidebarToggle" aria-label="Toggle Hub" title="Hub">
          <svg class="desk-pane-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="5" width="16" height="14" rx="2.5"></rect>
            <path d="M9 5v14"></path>
          </svg>
          <svg class="desk-pane-active-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect class="desk-pane-active-fill" x="4.75" y="5.75" width="8.25" height="12.5" rx="1.4"></rect>
            <rect x="4" y="5" width="16" height="14" rx="2.5"></rect>
            <path d="M13 5v14"></path>
          </svg>
        </button>
        <button type="button" class="desk-settings-icon-btn" id="deskReloadBtn" aria-label="Reload Hub" title="Reload Hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.623 1.491) scale(0.8751)"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"></path></g></svg>
        </button>
        <button type="button" class="desk-settings-icon-btn" id="deskSettingsBtn" data-desk-action="open-appearance" aria-label="Settings" title="Settings">
          <svg class="desk-settings-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="desk-settings-filled-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>
        </button>
        <span id="deskSessionTitleText" class="desk-session-title-text" aria-hidden="true"></span>
      </div>
      <div class="desk-sidebar-resizer" id="deskSidebarResizer" aria-hidden="true"></div>
      <section class="desk-main">
        <div class="desk-chat-shell">
          <iframe

            id="deskChatFrame"

        </div>
      </section>
      <div class="desk-workbench-outline" aria-hidden="true"></div>
    </div>
  </div>
